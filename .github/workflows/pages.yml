name: Publish calendar snapshot to Pages
on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot digest supplied by npm run pages:publish
        type: string
        required: true
      force_publish:
        description: Publish even if the calendar is unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: calendar-pages
  cancel-in-progress: false
jobs:
  generate:
    # Opt-in: a secret URL does not make Pages artifacts private.
    if: ${{ vars.PUBLISH_CALENDAR == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run pages:prepare
        id: prepare
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_CALENDAR_SNAPSHOT: ${{ secrets.PAGES_CALENDAR_SNAPSHOT }}
          PAGES_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          PAGES_FORCE_PUBLISH: ${{ inputs.force_publish && 'true' || 'false' }}
      - name: Calendar unchanged
        if: ${{ steps.prepare.outputs.changed == 'false' }}
        run: node -e "console.log('Calendar unchanged; keeping the current deployment.')"
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.prepare.outputs.changed == 'true' }}
        with:
          path: site
          retention-days: 1
  deploy:
    needs: generate
    if: ${{ needs.generate.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
